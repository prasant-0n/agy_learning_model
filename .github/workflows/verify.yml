name: Continuous Verification & Architecture Guardrails

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Deterministic Lifecycle Safety Gate Tests
        run: node labs/02-rules-skills-and-hooks/test-hook.mjs

      - name: Run Hardened Service & Integration Test Suites
        run: npm test
